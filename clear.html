<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>캐시 초기화 중...</title>
  <style>
    body { background:#0f1117; color:#e8eaf2; font-family:'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
    .msg { font-size:1.1rem; }
    .sub { color:#9aa0bc; font-size:0.85rem; margin-top:8px; }
  </style>
</head>
<body>
  <div>
    <div style="font-size:2.5rem;margin-bottom:16px">🔄</div>
    <div class="msg" id="msg">캐시 초기화 중...</div>
    <div class="sub" id="sub">잠시만 기다려주세요</div>
  </div>
  <script>
    async function run() {
      try {
        // 서비스 워커 전체 해제
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        // 캐시 전체 삭제
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        document.getElementById('msg').textContent = '완료! 앱으로 이동합니다...';
        document.getElementById('sub').textContent = '서비스 워커와 캐시가 모두 삭제되었어요';
        setTimeout(() => { location.href = '/'; }, 1500);
      } catch(e) {
        document.getElementById('msg').textContent = '오류: ' + e.message;
        document.getElementById('sub').innerHTML = '<a href="/" style="color:#7b8cde">수동으로 이동하기</a>';
      }
    }
    run();
  </script>
</body>
</html>
